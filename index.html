<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Trustant — Coming Soon</title>
  <meta content="Trustant is coming soon." name="description" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Trustant" />
  <meta property="og:title" content="Trustant — Coming Soon" />
  <meta property="og:description" content="Trustant is coming soon." />
  <meta property="og:image" content="/img/logo-trustant.png" />

  <!-- Favicon and icons -->
  <link rel="icon" href="/favicon/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />

  <!-- Preload fonts -->
  <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />

  <style>
    @font-face {
      font-family: "InterVariable";
      src: url("/fonts/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      --bg: #0b0a09;
      --fg: #f5f1ec;
      --muted: #a09a93;
      --accent: #d9702f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "InterVariable", system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(60% 50% at 50% 42%, rgba(217, 112, 47, 0.22), transparent 70%);
      pointer-events: none;
    }

    main {
      position: relative;
      width: 100%;
      max-width: 720px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .logo {
      width: min(420px, 82vw);
      height: auto;
      /* the logo asset is black on white — invert it for the dark page */
      filter: invert(1);
    }

    .mascot {
      width: min(300px, 62vw);
      height: auto;
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mascot {
        animation: none;
      }
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--accent);
      text-transform: uppercase;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main>
    <img class="logo" src="/img/logo-trustant.png" alt="Trustant" />
    <img class="mascot" src="/img/trusty-ant.png" alt="Trusty, the Trustant ant mascot, giving a thumbs up" />
    <h1>Coming soon!</h1>
    <p>We're busy building. Check back shortly.</p>
  </main>
</body>

</html>

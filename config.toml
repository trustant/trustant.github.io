base_url = "https://trustable.it"
title = "Trustant"
description = "Build full-stack applications with Private AI on your PC, workstation, private server, or sovereign infrastructure. Powered by Apache OpenServerless."

compile_sass = false
build_search_index = false
generate_feeds = false

# Content lives in content/ and is written as ordinary markdown with `@/`
# links between pages (@/documentation/provider.md); those resolve as internal links,
# so a broken cross-reference fails the build instead of the site.
[markdown]
highlight_code = true
highlight_theme = "base16-ocean-light"
smart_punctuation = true
